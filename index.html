<!DOCTYPE html>
<html>
<head>
  <title>Visitor Globe</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      text-align: center;
    }

    .globe-container {
      width: 100%;
      max-width: 400px;   /* smaller = more reliable */
      margin: 40px auto;
    }

    /* Let ClustrMaps control its internal canvas */
    .globe-container div,
    .globe-container canvas {
      max-width: 100%;
      height: auto !important;
    }

    @media (max-width: 600px) {
      .globe-container {
        max-width: 300px;
        margin: 20px auto;
      }
    }
  </style>
</head>

<body>

<div class="globe-container">
  <script type="text/javascript" id="clstr_globe"
  src="https://clustrmaps.com/globe.js?d=X_B5WWqjV6VzVp1Vr7M6v8GWxWmSrAoP8KTaMdRXXkk">
  </script>
</div>

</body>
</html>
