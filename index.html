<!DOCTYPE html>
<html>
<head>
  <title>Visitor Globe</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      padding: 0;
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .globe-wrapper {
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    /* This is the key: fixed render box */
    .globe-box {
      width: 300px;
      height: 300px;
      margin: 0 auto;
    }

    /* Scale container on smaller screens */
    @media (max-width: 500px) {
      .globe-box {
        width: 240px;
        height: 240px;
      }
    }
  </style>
</head>

<body>

<div class="globe-wrapper">
  <div class="globe-box">
    <script type="text/javascript" id="clstr_globe"
    src="https://clustrmaps.com/globe.js?d=X_B5WWqjV6VzVp1Vr7M6v8GWxWmSrAoP8KTaMdRXXkk">
    </script>
  </div>
</div>

</body>
</html>
