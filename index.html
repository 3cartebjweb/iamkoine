<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Live Visitors Globe • iamkoine</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background: #0b0f1a;
        }
        #globe {
            width: 100%;
            height: 100%;
        }
        #title {
            position: absolute;
            top: 15px;
            left: 15px;
            color: #ddd;
            font-family: system-ui, Arial, sans-serif;
            font-size: 18px;
            z-index: 10;
            pointer-events: none;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #777;
            font-family: system-ui, Arial, sans-serif;
            font-size: 16px;
            z-index: 10;
        }
    </style>
</head>
<body>

<div id="title">🌍 Live Visitors Globe • iamkoine</div>
<div id="loading">Loading spinning globe...</div>
<div id="globe"></div>

<script type="module">
    import Globe from 'https://cdn.jsdelivr.net/npm/globe.gl@2.45.3';

    const globeEl = document.getElementById('globe');
    const loadingEl = document.getElementById('loading');

    const world = Globe()(globeEl)
        .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
        .backgroundColor('#0b0f1a')
        .atmosphereColor('#4a90e2')
        .atmosphereAltitude(0.2)
        .pointAltitude(0.01)
        .pointRadius(0.5)
        .pointColor(() => '#ff3366');

    // Spinning globe (continuous gentle rotation)
    world.controls().autoRotate = true;
    world.controls().autoRotateSpeed = 0.35;

    // Responsive for all screen sizes + Google Sites iframe
    function resize() {
        world.width(window.innerWidth);
        world.height(window.innerHeight);
    }
    window.addEventListener('resize', resize);
    resize();

    // Hide loading text
    setTimeout(() => {
        loadingEl.style.display = 'none';
    }, 1500);

    // Show users from all over the world (glowing dots)
    let visitors = [];

    function addRandomVisitor() {
        const lat = (Math.random() * 150) - 75;
        const lng = Math.random() * 360 - 180;
        visitors.push({ lat, lng });
        if (visitors.length > 120) visitors.shift();
        world.pointsData(visitors);
    }

    // Initial visitors
    for (let i = 0; i < 35; i++) {
        addRandomVisitor();
    }

    // New visitors appear over time (live traffic feel)
    setInterval(() => {
        if (Math.random() > 0.25) addRandomVisitor();
    }, 1800);
</script>

</body>
</html>
