<!DOCTYPE html>
<html>
<head>
  <title>Visitor Globe</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden; /* prevents scrollbars in Google Sites */
    }

    .wrapper {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .globe-container {
      width: 90vmin;   /* scales based on smaller screen dimension */
      height: 90vmin;  /* keeps it perfectly square */
      max-width: 500px;
      max-height: 500px;
    }

    /* Force ClustrMaps injected elements to behave */
    .globe-container div,
    .globe-container canvas {
      width: 100% !important;
      height: 100% !important;
    }

    /* Mobile fine-tuning */
    @media (max-width: 600px) {
      .globe-container {
        width: 95vmin;
        height: 95vmin;
      }
    }
  </style>
</head>

<body>

<div class="wrapper">
  <div class="globe-container">
    <script type="text/javascript" id="clstr_globe"
    src="https://clustrmaps.com/globe.js?d=X_B5WWqjV6VzVp1Vr7M6v8GWxWmSrAoP8KTaMdRXXkk">
    </script>
  </div>
</div>

</body>
</html>
